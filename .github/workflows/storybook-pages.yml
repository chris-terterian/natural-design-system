name: Quality gates + deploy Storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0 # pinned: ships npm 11.19.0, which the lock file is generated with
          cache: npm
      - run: npm ci
      # Quality gates (GOVERNANCE.md §6): any failure stops the deploy
      - name: Typecheck
        run: npm run typecheck
      - name: validate_file guardrail (hardcoded values, naming, placeholder link text, a11y)
        run: node scripts/validate-file.mjs --all
      - name: Governance check (registry, specs, Figma links, generated tokens)
        run: npm run check:governance
      - name: Figma ↔ code parity (committed snapshot of the Figma file)
        run: npm run check:parity
      - name: Natural MCP server (tools, checkpoints catch drift)
        run: npm run check:mcp
      - name: Build Storybook
        run: npm run build-storybook
      - name: Install Chromium for the accessibility gate
        run: npx playwright install --with-deps chromium
      - name: Accessibility gate (axe, WCAG 2.2 AA, every story)
        run: npm run check:a11y
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
